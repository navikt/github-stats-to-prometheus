apiVersion: nais.io/v1
kind: Naisjob
metadata:
  labels:
    team: appsec
  name: appsec-github-stats-job
  namespace: appsec
spec:
  image: "{{ image }}"
  schedule: "0 6-18 * * *"
  timeZone: Europe/Oslo
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 1
  backoffLimit: 0
  activeDeadlineSeconds: 3000
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi
  envFrom:
    - secret: appsec-stats-config
  env:
    - name: PUSH_GATEWAY_ADDRESS
      value: "prometheus-pushgateway.nais-system:9091"
    - name: GITHUB_API_VERSION
      value: "2026-03-10"
    - name: GITHUB_API_URL
      value: "https://api.github.com/"
    - name: GITHUB_TEAMS
      value: "appsec"
    - name: GITHUB_ORG
      value: "navikt"
    # Default heap is 25% of the container limit; ExitOnOutOfMemoryError makes OOM fail fast with a log line instead of a silent hang/kill
    - name: JAVA_TOOL_OPTIONS
      value: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
  accessPolicy:
    outbound:
      rules:
        - application: prometheus-pushgateway
          namespace: nais-system
      external:
        - host: "api.github.com"
